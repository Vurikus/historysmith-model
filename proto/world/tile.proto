syntax = "proto3";

package proto.world;

option java_multiple_files = true;
option java_outer_classname = "TileProtoOuter";

import "proto/world/tile_key.proto";

message TileProto {
  proto.world.TileKeyProto key = 1;
  string mt1_relief = 2;
  string mt2_relief = 3;
  string mt3_relief = 4;
  string terrain_type = 5;
}
