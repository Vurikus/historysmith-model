syntax = "proto3";

package proto.worldbase;

option java_multiple_files = true;
option java_outer_classname = "WorldMetaProtoOuter";

import "proto/worldbase/world_configuration.proto";

message WorldMetaProto {
  int32 version = 1; // номер версии объекта
  string id = 2;
  proto.worldbase.WorldConfigurationProto configuration = 3;
//  TODO это бы вынести куда то в отдельные объекты
  int32 count_civ = 4;
  int32 count_players = 5;
}