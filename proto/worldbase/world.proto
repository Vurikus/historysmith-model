syntax = "proto3";

package proto.worldbase;

option java_multiple_files = true;
option java_outer_classname = "WorldProtoOuter";

import "proto/worldbase/world_meta.proto";
import "proto/world/tile.proto";
import "proto/syncstate/feature.proto";
import "proto/syncstate/building.proto";
import "proto/syncstate/civilization.proto";

message WorldProto {
  int32 version = 1; // номер версии объекта
  proto.worldbase.WorldMetaProto meta = 2;
  repeated proto.world.TileProto tiles = 3;
  repeated proto.syncstate.FeatureProto features = 4;           // Улучшения на момент загрузки мира
  repeated proto.syncstate.BuildingProto buildings = 5;         // Здания на момент загрузки мира
  repeated proto.syncstate.CivilizationProto civilizations = 6; // Цивилизации на момент загрузки мира
}
