syntax = "proto3";

package proto.worldbase;

option java_multiple_files = true;
option java_outer_classname = "WorldProtoOuter";

import "proto/worldbase/world_meta.proto";
import "proto/world/tile.proto";

message WorldProto {
  int32 version = 1; // номер версии объекта
  proto.worldbase.WorldMetaProto meta = 2;
  repeated proto.world.TileProto tiles = 3;
}