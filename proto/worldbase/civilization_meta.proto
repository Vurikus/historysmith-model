syntax = "proto3";

package proto.worldbase;

option java_multiple_files = true;
option java_outer_classname = "CivilizationMetaProtoOuter";

// Метаданные цивилизации игрового мира
message CivilizationMetaProto {
  string id = 1; // идентификатор цивилизации
  string code_name = 2; // кодовое название цивилизации
  string code_state = 3; // код государства цивилизации
  string code_culture = 4; // код культуры цивилизации
  string flag = 5; // флаг цивилизации
  string color_hex = 6; // hex-цвет цивилизации без альфа-канала
}
