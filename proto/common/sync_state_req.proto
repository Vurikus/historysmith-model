syntax = "proto3";

package proto.common;

option java_multiple_files = true;
option java_outer_classname = "SyncStateRequestProtoOuter";

import "proto/syncstate/filter/filter_id.proto";
import "proto/syncstate/filter/filter_feature.proto";
import "proto/syncstate/filter/filter_version.proto";
import "proto/syncstate/filter/filter_active_construction.proto";

// Мессадж для синхронизации состояния игровой партии на клиенте. Мессадж идет только со стороны клиента.
// Способ отбора объектов задаётся фильтром; тип объекта передаётся только там, где он нужен для проверки запроса.
message SyncStateRequestProto {
  oneof payload {
    proto.syncstate.FilterIdProto filter_id = 1;                                  // Объекты одного типа по идентификаторам
    proto.syncstate.FilterFeatureProto filter_feature = 2;                        // Улучшение по расположению на микроклетке
    proto.syncstate.FilterVersionProto filter_version = 3;                        // Сверка версий объектов любых типов
    proto.syncstate.FilterActiveConstructionProto filter_active_construction = 4; // Активные строительства своей цивилизации
  }
}
