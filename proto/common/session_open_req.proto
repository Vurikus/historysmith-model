syntax = "proto3";

package proto.common;

option java_multiple_files = true;
option java_outer_classname = "SessionOpenRequestProtoOuter";

// Служебное открытие сессии клиента, к партии не относится: первое сообщение по каждому новому websocket. До ответа
// на него сервер принимает от соединения только пинг. Пустой токен открывает новую сессию, токен прежней сессии
// возобновляет её, пока сервер держит сессию после обрыва соединения. Сессию, которую сервер уже забыл, он
// не возобновляет и отвечает ошибкой CL_0004
message SessionOpenRequestProto {
  string session_token = 1; // Токен возобновляемой сессии; пустой — открыть новую сессию
}
