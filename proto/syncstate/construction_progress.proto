syntax = "proto3";

package proto.syncstate;

option java_multiple_files = true;
option java_outer_classname = "ConstructionProgressProtoOuter";

// Активное строительство цивилизации и его прогресс
message ConstructionProgressProto {
  string construction_id = 1;              // UUID будущей конструкции; после завершения строительства станет id улучшения или здания
  string model_name = 2;                   // Имя модели строящегося улучшения или здания
  string tile_id = 3;                      // UUID клетки строительства
  uint32 mt_index = 4;                     // Индекс микроклетки внутри клетки, начиная с нуля
  int32 managerial_point_invested = 5;     // Вложено управленческих очков, от 0 до managerial_point_cost
  int32 managerial_point_cost = 6;         // Полная стоимость строительства, управленческие очки
  oneof target {
    proto.syncstate.FeatureConstructionTargetProto feature = 7;    // Строится улучшение на микроклетке
    proto.syncstate.BuildingConstructionTargetProto building = 8;  // Строится здание в слоте улучшения
  }
}

message FeatureConstructionTargetProto {
}

message BuildingConstructionTargetProto {
  string feature_id = 1;                   // UUID улучшения, в слот которого ставится здание
  uint32 feature_slot_index = 2;           // Индекс слота в улучшении, начиная с нуля
}
