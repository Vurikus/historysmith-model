syntax = "proto3";

package proto.syncstate;

option java_multiple_files = true;
option java_outer_classname = "CivilizationProtoOuter";

import "proto/syncstate/civ_personalization.proto";

// Изменяемое состояние цивилизации. Секретари цивилизации (SecretaryTypeProto) синхронизируются отдельно от неё
message CivilizationProto {
  string id = 1;                                                                // UUID цивилизации
  int64 version = 2;                                                            // Версия состояния цивилизации; начинается с 0, растёт на 1 за изменение персонализации и клеток во владении; изменения секретарей из SecretaryTypeProto её не меняют
  proto.syncstate.CivPersonalizationProto personalization = 3;                  // Персонализация цивилизации
  repeated string tile_ids = 4;                                                 // UUID клеток во владении цивилизации
}
