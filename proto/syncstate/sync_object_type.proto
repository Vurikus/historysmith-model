syntax = "proto3";

package proto.syncstate;

option java_multiple_files = true;
option java_outer_classname = "SyncObjectTypeProtoOuter";

// Тип версионируемого игрового объекта, который клиент запрашивает по идентификаторам.
// Значение 0 означает, что тип не передан, и сервер отвечает ошибкой запроса.
enum SyncObjectTypeProto {
  SyncObjectTypeUnspecified = 0;
  Feature = 1;                     // Улучшение на микроклетке
  Building = 2;                    // Здание в слоте улучшения
  Citizen = 3;                     // Житель
  ConstructionProgress = 4;        // Активное строительство и его прогресс
  Civilization = 5;                // Цивилизация: персонализация, клетки во владении и активные строительства
  Tile = 6;                        // Клетка: погода, модификаторы и жители
}
