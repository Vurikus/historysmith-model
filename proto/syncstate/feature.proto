syntax = "proto3";

package proto.syncstate;

option java_multiple_files = true;
option java_outer_classname = "FeatureProtoOuter";

// Состояние улучшения на микроклетке. Улучшение — контейнер для зданий, товары выбираются только на уровне здания.
message FeatureProto {
  string id = 1;                                   // UUID улучшения
  string tile_id = 2;                              // UUID клетки
  string model_name = 3;                           // Имя модели улучшения
  repeated string building_ids = 4;                // UUID зданий; индекс элемента равен индексу слота
  int64 version = 5;                               // Версия состояния улучшения; начинается с 0, растёт на 1 за изменение
  uint32 mt_index = 6;                             // Индекс микроклетки внутри клетки, начиная с нуля
  int32 housing_volume = 7;                        // Суммарная вместимость жилья всех зданий улучшения, жители
}
