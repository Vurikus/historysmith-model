syntax = "proto3";

package proto.syncstate;

option java_multiple_files = true;
option java_outer_classname = "FeatureProtoOuter";

message FeatureProto {
  string id = 1;
  string tile_id = 2;
  string model_name = 3;
  repeated string building_ids = 4;
  string produced_product_model_name = 5;
}
