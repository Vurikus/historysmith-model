syntax = "proto3";

package proto.syncstate;

option java_multiple_files = true;
option java_outer_classname = "TileModifierProtoOuter";

// Активный модификатор на клетке
message TileModifierProto {
  string modifier_type = 1;        // Тип описания модификатора, имя значения ModifierDescriptionType
  int32 expiration_turn = 2;       // Номер хода, на котором модификатор перестаёт действовать
}
