syntax = "proto3";

package proto.syncstate;

option java_multiple_files = true;
option java_outer_classname = "ConstructionQueueProtoOuter";

import "proto/syncstate/construction_progress.proto";

// Очередь активного строительства цивилизации
message ConstructionQueueProto {
  string id = 1;                                                 // UUID очереди строительства
  int64 version = 2;                                             // Версия очереди; начинается с 0, растёт на 1 за изменение состава или прогресса
  string civilization_id = 3;                                    // UUID цивилизации-владельца
  repeated proto.syncstate.ConstructionProgressProto items = 4;  // Активные строительства в порядке очереди
}
