syntax = "proto3";

package proto.syncstate;

option java_multiple_files = true;
option java_outer_classname = "SyncStateObjectProtoOuter";

import "proto/syncstate/feature.proto";
import "proto/syncstate/building.proto";
import "proto/syncstate/citizen.proto";
import "proto/syncstate/construction_progress.proto";
import "proto/syncstate/civilization.proto";
import "proto/world/tile.proto";
import "proto/syncstate/world.proto";

// Один синхронизируемый игровой объект. Версия хранится внутри каждого объекта.
message SyncStateObjectProto {
  oneof object {
    proto.syncstate.FeatureProto feature = 1;
    proto.syncstate.BuildingProto building = 2;
    proto.syncstate.CitizenProto citizen = 3;
    proto.syncstate.ConstructionProgressProto construction_progress = 4;
    proto.syncstate.CivilizationProto civilization = 5;
    proto.world.TileProto tile = 6;
    proto.syncstate.WorldProto world = 7;
  }
}
