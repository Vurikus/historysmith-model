syntax = "proto3";

package proto.syncstate;

option java_multiple_files = true;
option java_outer_classname = "SecretaryVersionProtoOuter";

import "proto/syncstate/secretary_key.proto";

// Версия секретаря цивилизации, известная клиенту
message SecretaryVersionProto {
  proto.syncstate.SecretaryKeyProto key = 1; // Ключ секретаря
  int64 version = 2;                         // Версия секретаря на клиенте; -1 — данных секретаря у клиента нет: такой версии на сервере не бывает, поэтому секретарь приходит всегда; меньше -1 — ошибка запроса
}
