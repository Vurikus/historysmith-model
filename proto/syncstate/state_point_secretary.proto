syntax = "proto3";

package proto.syncstate;

option java_multiple_files = true;
option java_outer_classname = "StatePointSecretaryProtoOuter";

import "proto/syncstate/state_point_volume.proto";

// Секретарь очков государства цивилизации: остатки всех видов очков
message StatePointSecretaryProto {
  string civilization_id = 1;                                     // UUID цивилизации-владельца
  int64 version = 2;                                              // Версия секретаря; начинается с 0, растёт на 1 за изменение остатков
  repeated proto.syncstate.StatePointVolumeProto state_points = 3; // Остатки всех видов очков государства из модели, включая нулевые
}
