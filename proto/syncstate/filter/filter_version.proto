syntax = "proto3";

package proto.syncstate;

option java_multiple_files = true;
option java_outer_classname = "FilterVersionProtoOuter";

import "proto/syncstate/object_version.proto";

// Сверка версий известных клиенту игровых объектов любых типов.
// Объекты с несовпадающей версией сервер возвращает в sync_objects, с совпадающей — в already_sync_ids,
// ненайденные — в nonexistent_ids.
message FilterVersionProto {
  repeated proto.syncstate.ObjectVersionProto objects = 1;  // Идентификаторы не должны повторяться
}
