syntax = "proto3";

package proto.syncstate;

option java_multiple_files = true;
option java_outer_classname = "FilterSecretaryProtoOuter";

import "proto/syncstate/secretary_version.proto";

// Сверка версий секретарей цивилизаций.
// Секретари с несовпадающей версией сервер возвращает в sync_objects, с совпадающей — ключами в already_sync_secretaries;
// UUID ненайденной цивилизации — в nonexistent_ids.
// Запрос секретаря, которого игрок видеть не может, считается ошибкой запроса. Сейчас игрок видит только секретарей
// своей цивилизации.
message FilterSecretaryProto {
  repeated proto.syncstate.SecretaryVersionProto secretaries = 1; // Ключи не должны повторяться
}
