syntax = "proto3";

package proto.syncstate;

option java_multiple_files = true;
option java_outer_classname = "ConstructionSecretaryProtoOuter";

import "proto/syncstate/construction_progress.proto";

// Секретарь активных строительств цивилизации: все строительства с прогрессом, не больше одного на клетку
message ConstructionSecretaryProto {
  string civilization_id = 1;                                                  // UUID цивилизации-владельца
  int64 version = 2;                                                           // Версия секретаря; начинается с 0, растёт на 1 за начало, вложение очков, отмену и завершение строительства
  repeated proto.syncstate.ConstructionProgressProto active_constructions = 3; // Активные строительства цивилизации и их прогресс
}
