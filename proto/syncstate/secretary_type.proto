syntax = "proto3";

package proto.syncstate;

option java_multiple_files = true;
option java_outer_classname = "SecretaryTypeProtoOuter";

// Тип секретаря цивилизации — части состояния цивилизации, которая версионируется и синхронизируется отдельно от неё.
// Тяжёлый секретарь может делиться на несколько типов, у каждого своя версия.
// Значение 0 означает, что тип не передан, и сервер отвечает ошибкой запроса.
enum SecretaryTypeProto {
  SecretaryTypeUnspecified = 0;
  StatePoint = 1;                  // Очки государства цивилизации
}
