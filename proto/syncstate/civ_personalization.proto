syntax = "proto3";

package proto.syncstate;

option java_multiple_files = true;
option java_outer_classname = "CivPersonalizationProtoOuter";

// Персонализация цивилизации: название, государство, культура и внешний вид
message CivPersonalizationProto {
  string code_name = 1; // кодовое название цивилизации
  string code_state = 2; // код государства цивилизации
  string code_culture = 3; // код культуры цивилизации
  string flag = 4; // флаг цивилизации
  string color_hex = 5; // hex-цвет цивилизации без альфа-канала
}
