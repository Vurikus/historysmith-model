syntax = "proto3";

package proto.syncstate;

option java_multiple_files = true;
option java_outer_classname = "CitizenRequirementProtoOuter";

// Состояние одной потребности жителя за текущий ход
message CitizenRequirementProto {
  int32 count_slot = 1;                              // Количество слотов потребности
  repeated string consumed_product_model_names = 2;  // Имена моделей потреблённых товаров, один элемент на занятый слот
}
