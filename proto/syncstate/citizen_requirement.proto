syntax = "proto3";

package proto.syncstate;

option java_multiple_files = true;
option java_outer_classname = "CitizenRequirementProtoOuter";

// Норма потребности жителя и результат последнего завершённого хода
message CitizenRequirementProto {
  int32 count_slot = 1;                              // Количество слотов потребности
  repeated string consumed_product_model_names = 2;  // Имена моделей товаров, потреблённых при завершении хода. Один элемент на заполненный слот
}
