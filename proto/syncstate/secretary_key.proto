syntax = "proto3";

package proto.syncstate;

option java_multiple_files = true;
option java_outer_classname = "SecretaryKeyProtoOuter";

import "proto/syncstate/secretary_type.proto";

// Ключ секретаря цивилизации. Своего идентификатора у секретаря нет: у цивилизации ровно один секретарь каждого типа
message SecretaryKeyProto {
  string civilization_id = 1;                 // UUID цивилизации-владельца
  proto.syncstate.SecretaryTypeProto type = 2; // Тип секретаря
}
