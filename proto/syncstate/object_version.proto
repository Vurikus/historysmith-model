syntax = "proto3";

package proto.syncstate;

option java_multiple_files = true;
option java_outer_classname = "ObjectVersionProtoOuter";

// Версия игрового объекта, известная клиенту
message ObjectVersionProto {
  string id = 1;                   // UUID игрового объекта
  int64 version = 2;               // Версия объекта на клиенте; отрицательное значение — объект клиенту ещё неизвестен
}
