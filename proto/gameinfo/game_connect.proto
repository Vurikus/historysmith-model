syntax = "proto3";

package proto.gameinfo;

option java_multiple_files = true;
option java_outer_classname = "GameConnectProtoOuter";

// Объект служит информацией о подключении игрока к игровой партии
message GameConnectProto {
  string game_id = 1; // идентификатор игровой партии к которой желает подключиться игрок
  string civilization_id = 2; // идентификатор цивилизации за которую желает выступить игрок
}
