syntax = "proto3";

package proto.gameinfo;

option java_multiple_files = true;
option java_outer_classname = "GameConnectProtoOuter";

// Подключение игрока к цивилизации партии, в которую вошла сессия. Повторное подключение к той же цивилизации
// возвращает текущий статус игрока
message GameConnectProto {
  string civilization_id = 1; // идентификатор цивилизации за которую желает выступить игрок
}
