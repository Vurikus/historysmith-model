syntax = "proto3";

package proto.gameinfo;

option java_multiple_files = true;
option java_outer_classname = "SessionOpenProtoOuter";

// Открытие сессии клиента: первое сообщение по каждому новому websocket. До ответа на него сервер не принимает
// других запросов этого соединения. Пустой токен открывает новую сессию, токен прежней сессии возобновляет её,
// пока сервер держит сессию после обрыва соединения. Сессию, которую сервер уже забыл, он не возобновляет
// и отвечает ошибкой CL_0004
message SessionOpenProto {
  string session_token = 1; // Токен возобновляемой сессии; пустой — открыть новую сессию
}
