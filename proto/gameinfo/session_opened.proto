syntax = "proto3";

package proto.gameinfo;

option java_multiple_files = true;
option java_outer_classname = "SessionOpenedProtoOuter";

import "proto/gameinfo/player_status.proto";

// Ответ на открытие сессии: сессия открыта или возобновлена
message SessionOpenedProto {
  string session_token = 1;                           // Токен сессии: с ним клиент возобновляет сессию после обрыва соединения
  int64 reconnect_grace_millis = 2;                   // Сколько сервер держит сессию после обрыва соединения, мс: загрузку партии, лок цивилизации и место игрока
  int64 ping_interval_millis = 3;                     // Как часто клиент проверяет соединение пингом, мс. Соединение, молчащее дольше трёх интервалов, сервер закрывает
  proto.gameinfo.PlayerStatusProto player_status = 4; // Статус игрока, если он играет за цивилизацию; не задан, если игрок не подключён к партии
}
