syntax = "proto3";

package proto.gameinfo;

option java_multiple_files = true;
option java_outer_classname = "CivilizationSummaryProtoOuter";

import "proto/gameinfo/player_type.proto";

// Сводка по цивилизации для выбора цивилизации игроком
message CivilizationSummaryProto {
  string civilization_id = 1;                       // UUID цивилизации
  proto.gameinfo.PlayerTypeProto player_type = 2;  // Кто сейчас играет за цивилизацию
}
