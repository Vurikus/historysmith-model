syntax = "proto3";

package proto.common;

option java_multiple_files = true;
option java_outer_classname = "BuildFeaturePurposePlayerActionProtoOuter";

// Запрос строительства улучшения на микроклетке
message BuildFeaturePurposePlayerActionProto {
  string feature_model_name = 1;   // Имя модели размещаемого улучшения
  string tile_id = 2;              // UUID клетки
  uint32 mt_index = 3;             // Индекс микроклетки внутри клетки, начиная с нуля
}
