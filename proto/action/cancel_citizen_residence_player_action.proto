syntax = "proto3";

package proto.common;

option java_multiple_files = true;
option java_outer_classname = "CancelCitizenResidencePlayerActionProtoOuter";

// Прекращение обучения жителя без компенсации с восстановлением исходного профиля
message CancelCitizenResidencePlayerActionProto {
  string citizen_id = 1;           // UUID жителя
}
