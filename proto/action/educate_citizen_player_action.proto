syntax = "proto3";

package proto.common;

option java_multiple_files = true;
option java_outer_classname = "EducateCitizenPlayerActionProtoOuter";

// Начало обучения жителя в здании до выбранного профиля
message EducateCitizenPlayerActionProto {
  string citizen_id = 1;                 // UUID жителя
  string building_id = 2;                // UUID здания, в котором проходит обучение
  string target_profile_model_name = 3;  // Имя модели целевого профиля жителя
}
