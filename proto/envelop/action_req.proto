syntax = "proto3";

package proto.envelop;

option java_multiple_files = true;
option java_outer_classname = "ActionRequestProtoOuter";

import "proto/action/end_turn_player_action.proto";
import "proto/action/apply_craft_tool_player_action.proto";
import "proto/action/build_feature_purpose_player_action.proto";
import "proto/action/cancel_citizen_residence_player_action.proto";
import "proto/action/educate_citizen_player_action.proto";
import "proto/action/fire_citizen_player_action.proto";
import "proto/action/hire_citizen_player_action.proto";
import "proto/action/select_extraction_product_on_building_player_action.proto";
import "proto/action/rename_tile_player_action.proto";
import "proto/action/build_building_purpose_player_action.proto";
import "proto/action/cancel_construction_player_action.proto";
import "proto/action/demolish_construction_purpose_player_action.proto";
import "proto/action/invest_managerial_point_player_action.proto";

message ActionRequestProto {
  oneof payload {
    proto.action.EndTurnPlayerActionProto end_turn_player = 1;                                         // Завершение игрового хода игроком
    proto.action.ApplyCraftToolPlayerActionProto apply_craft_tool = 2;                                 // Применение ремесленного инструмента к товару
    proto.action.BuildFeaturePurposePlayerActionProto build_feature_purpose = 3;                       // Запрос строительства улучшения на микроклетке
    proto.action.CancelCitizenResidencePlayerActionProto cancel_citizen_residence = 4;                 // Прекращение обучения жителя
    proto.action.EducateCitizenPlayerActionProto educate_citizen = 5;                                  // Начало обучения жителя
    proto.action.FireCitizenPlayerActionProto fire_citizen = 6;                                        // Увольнение жителя
    proto.action.HireCitizenPlayerActionProto hire_citizen = 7;                                        // Найм жителя в здание
    proto.action.SelectExtractionProductOnBuildingPlayerActionProto select_extraction_product = 8;     // Выбор добываемого товара в здании
    proto.action.RenameTilePlayerActionProto rename_tile = 9;                                          // Переименование клетки её владельцем
    proto.action.BuildBuildingPurposePlayerActionProto build_building_purpose = 10;                    // Запрос строительства здания в слоте улучшения
    proto.action.CancelConstructionPlayerActionProto cancel_construction = 11;                         // Отмена активного строительства с частичным возвратом стоимости заказа
    proto.action.DemolishConstructionPurposePlayerActionProto demolish_construction_purpose = 12;      // Запрос сноса улучшения или здания до дефолтного
    proto.action.InvestManagerialPointPlayerActionProto invest_managerial_point = 13;                  // Вложение управленческих очков в активное строительство
  }
}
