syntax = "proto3";

package proto.envelop;

option java_multiple_files = true;
option java_outer_classname = "EnvelopeRequestProtoOuter";

import "proto/envelop/sync_state_req.proto";
import "proto/envelop/action_req.proto";
import "proto/envelop/game_req.proto";
import "proto/envelop/intention_req.proto";
import "proto/envelop/ping_req.proto";
import "proto/envelop/session_open_req.proto";

message EnvelopeRequestProto {
  int32 message_id = 1;
  oneof payload {
    proto.envelop.SyncStateRequestProto sync_state = 2;        // Запрос с клиента на получение актуального состояния объекта
    proto.envelop.ActionRequestProto action = 3;               // Объект с конкретным действием игрока. Например переместить отряд. Построить здание...
    proto.envelop.IntentionRequestProto intention = 4;         // Запросы на попытку совершить действие, намерение. Например игрок навел кнопку с попыткой атаковать
    proto.envelop.GameRequestProto game = 5;                   // Действия и запросы информации, относящиеся к самой игре: создание партии, получение списка партий, подключение игрока к партии
    proto.envelop.PingRequestProto ping = 6;                   // Служебная проверка соединения; ответ — success
    proto.envelop.SessionOpenRequestProto session_open = 7;    // Служебное открытие или возобновление сессии: первое сообщение websocket
  }
}